name: Build image

on:
  schedule:
    - cron: "17 5 * * *" # daily, picks up new upstream Coder releases
  push:
    branches: [main]
    paths:
      - Dockerfile
      - rootfs/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      coder_version:
        description: "Upstream Coder tag to build (e.g. v2.36.7). Blank = latest release."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/coder-unraid

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.exists.outputs.build }}
    steps:
      - name: Resolve upstream Coder version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.coder_version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            v=$(gh api repos/coder/coder/releases/latest --jq .tag_name)
          fi
          case "$v" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "unexpected tag: $v" >&2; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building against coder $v"

      - name: Check whether this version was already published
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"            # v2.36
          {
            echo "tags<<EOT"
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$minor"
            echo "$IMAGE:latest"
            echo "EOT"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CODER_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
